# Inactive example: GitHub only loads workflow files directly under
# .github/workflows. Move this file there when the runner is ready.
name: Self-hosted CI example

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Branch quality on self-hosted runner
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DemoWeb.sln
      - name: Verify formatting and coding conventions
        run: dotnet format DemoWeb.sln --verify-no-changes --no-restore
      - name: Run unit and endpoint tests
        run: dotnet test tests/DemoWeb.Tests/DemoWeb.Tests.csproj --configuration Release --no-restore
      - name: Build with analyzers and warnings as errors
        run: dotnet publish src/DemoWeb/DemoWeb.csproj --configuration Release --no-restore --output "$RUNNER_TEMP/publish"
      - name: Smoke-test the published application
        shell: bash
        run: |
          set -euo pipefail
          dotnet "$RUNNER_TEMP/publish/DemoWeb.dll" --urls http://127.0.0.1:8080 &
          app_pid=$!
          trap 'kill "$app_pid"; wait "$app_pid" || true' EXIT
          bash tests/smoke.sh http://127.0.0.1:8080
      - name: Build and smoke-test the container
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag demo-web:self-hosted-ci .
          container_id=$(docker run --detach --publish 127.0.0.1:8081:8080 demo-web:self-hosted-ci)
          trap 'docker rm --force "$container_id" >/dev/null' EXIT
          bash tests/smoke.sh http://127.0.0.1:8081
